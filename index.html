<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>Supabase Auth - Login & Signup</title>
    <!-- Maktaba ya Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div style="max-width: 400px; margin: 50px auto; font-family: Arial;">
        <h2>Mfumo wa Supabase Auth</h2>

        <!-- SEHEMU YA KUJISAJILI -->
        <div style="border: 1px solid #ccc; padding: 20px; margin-bottom: 20px;">
            <h3>Jisajili (Sign Up)</h3>
            <input type="email" id="signup-email" placeholder="Weka Email" style="width: 100%; margin-bottom: 10px; padding: 8px;"><br>
            <input type="password" id="signup-password" placeholder="Weka Password" style="width: 100%; margin-bottom: 10px; padding: 8px;"><br>
            <button onclick="fanyaSignUp()" style="padding: 10px 15px; background: green; color: white; border: none; cursor: pointer;">Jisajili</button>
        </div>

        <!-- SEHEMU YA KUINGIA -->
        <div style="border: 1px solid #ccc; padding: 20px;">
            <h3>Ingia (Login)</h3>
            <input type="email" id="login-email" placeholder="Weka Email" style="width: 100%; margin-bottom: 10px; padding: 8px;"><br>
            <input type="password" id="login-password" placeholder="Weka Password" style="width: 100%; margin-bottom: 10px; padding: 8px;"><br>
            <button onclick="fanyaLogin()" style="padding: 10px 15px; background: blue; color: white; border: none; cursor: pointer;">Ingia</button>
        </div>

        <p id="ujumbe" style="color: red; margin-top: 15px;"></p>
    </div>

    <!-- Tunapakia kwanza faili la supabase.js ili supabaseClient ipatikane -->
    <script src="supabase.js"></script>
    <script>
        // Kitendakazi cha Kujisajili
        async function fanyaSignUp() {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            
            if (error) {
                document.getElementById('ujumbe').innerText = error.message;
            } else {
                alert('Umejisajili kwa mafanikio! Sasa unaweza kuingia.');
            }
        }

        // Kitendakazi cha Kuingia
        async function fanyaLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                document.getElementById('ujumbe').innerText = error.message;
            } else {
                alert('Umeingia vizuri!');
                // Mpeleke mtumiaji kwenye ukurasa wa dashboard
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
